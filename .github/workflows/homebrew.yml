name: Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to add to the tap
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: macos-latest
    steps:
      - name: Create tap token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            nfctl
            homebrew-tap
      - name: Download formula
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'nfctl.rb'
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: txmxthy/homebrew-tap
          token: ${{ steps.release-token.outputs.token }}
          persist-credentials: true
          path: tap
      - name: Validate formula
        run: |
          mkdir -p tap/Formula
          cp nfctl.rb tap/Formula/nfctl.rb
          ruby -pi -e 'sub(/^  desc .*/, %q{  desc "Command-line interface and terminal UI for operating Numaflow pipelines"})' tap/Formula/nfctl.rb
          sed -i '' '/^  version /d' tap/Formula/nfctl.rb
          ruby -0pi -e 'sub(/\nend\n\z/, "\n\n  test do\n    assert_match version.to_s, shell_output(\"\#{bin}/nfctl --version\")\n  end\nend\n")' tap/Formula/nfctl.rb
          brew style --fix tap/Formula/nfctl.rb
          brew style tap/Formula/nfctl.rb
          brew tap txmxthy/tap
          tap_repo=$(brew --repository txmxthy/tap)
          mkdir -p "$tap_repo/Formula"
          cp tap/Formula/nfctl.rb "$tap_repo/Formula/nfctl.rb"
          brew audit --strict --online txmxthy/tap/nfctl
      - name: Publish formula
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        working-directory: tap
        run: |
          git config user.name "txmxthy release automation"
          git config user.email "release-automation@users.noreply.github.com"
          git add Formula/nfctl.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(nfctl): update formula to $RELEASE_TAG"
          git push origin HEAD:main
