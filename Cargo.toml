[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/txmxthy/nfctl"
authors = ["Tim"]

[workspace.dependencies]
# workspace crates
nfctl-core = { path = "crates/nfctl-core", version = "0.1.0" }
nfctl-k8s = { path = "crates/nfctl-k8s", version = "0.1.0" }
nfctl-daemon = { path = "crates/nfctl-daemon", version = "0.1.0" }
nfctl-graph = { path = "crates/nfctl-graph", version = "0.1.0" }
nfctl-tui = { path = "crates/nfctl-tui", version = "0.1.0" }

# async
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# errors / data
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "registry", "std"] }

# cli
# `~4.6`: dynamic completion is behind an unstable feature; the API can move between minors.
clap = { version = "~4.6", features = ["derive", "env", "wrap_help", "unstable-ext"] }
clap_complete = { version = "~4.6", features = ["unstable-dynamic"] }

# dev
insta = { version = "1.48", features = ["yaml"] }
assert_cmd = "2.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# pedantic opt-outs that hurt more than they help
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
