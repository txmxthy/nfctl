[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# The generated workflow is hand-edited to retain a manual publication gate.
allow-dirty = ["ci"]
# Only the CLI produces a release artifact.
packages = ["nfctl-cli"]
# CI backends to support
ci = "github"
# Run the repository's normal checks before any release artifacts are built.
plan-jobs = ["./ci"]
# The installers to generate for each app
installers = ["homebrew"]
# The formula is generated with the draft, then published after manual approval.
tap = "txmxthy/homebrew-tap"
formula = "nfctl"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Emit standard SHA-256 files beside every archive.
checksum = "sha256"
# Where to host releases
hosting = "github"
# Attach verifiable build provenance to release artifacts.
github-attestations = true

[dist.github-action-commits]
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
