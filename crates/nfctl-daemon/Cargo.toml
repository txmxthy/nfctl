[package]
name = "nfctl-daemon"
description = "Numaflow daemon adapter for nfctl (implements DaemonPort)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
nfctl-core.workspace = true
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
hyper = { version = "1.7", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
http = "1.3"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { workspace = true, features = ["net", "time", "io-util"] }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
wiremock = "0.6"
nfctl-k8s.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
